services:
  e:
    image: ghcr.io/thelovinator1/e.lovinator.space:latest
    restart: unless-stopped
    # Reap child processes (yt-dlp/ffmpeg) and handle signals cleanly.
    init: true
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      REDDIT_REFRESH_TOKEN: ${REDDIT_REFRESH_TOKEN:-}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/data
